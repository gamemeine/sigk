model:
  _target_: p1.inpainting.modeling.pconv.model.PartConvModel
  channels: [32, 64, 128, 256, 256, 256, 256]

loss:
  _target_: p1.inpainting.modeling.pconv.model.InpaintingLoss

data:
  _target_: p1.inpainting.data.DIV2KDataset
  root: p1/data
  split: train
  n: 5000
  seed: ${training.seed}
  cut_size: [3, 32]

training:
  experiment_name: pconv_basic
  device: cpu
  epochs: 20
  save_epochs: 10
  batch_size: 16
  lr: 2e-4
  seed: 42
  val_size: 0.2
