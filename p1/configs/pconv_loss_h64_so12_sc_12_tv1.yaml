model:
  _target_: p1.inpainting.modeling.pconv.model.PartConvModel
  channels: [64, 128, 256, 512, 512, 512, 512, 512]

loss:
  _target_: p1.inpainting.modeling.pconv.model.InpaintingLoss
  weights:
    valid: 1.0
    hole: 64.0
    perceptual: 0.05
    style_out: 12.0
    style_comp: 12.0
    tv: 1.0

data:
  _target_: p1.inpainting.data.DIV2KDataset
  root: p1/data
  crop_size: 256
  split: train
  num_samples: 10_000
  seed: ${training.seed}
  cut_size: [3, 32]

training:
  experiment_name: pconv_loss_h64_so12_sc_12_tv1
  device: auto
  epochs: 250
  save_epochs: 10
  batch_size: 64
  num_workers: 8
  log_every: 20
  lr: 2e-4
  scheduler: null
  seed: 42
  val_size: 0.1
