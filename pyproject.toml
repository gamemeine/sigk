[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sigk"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "hydra-core>=1.3.8",
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "torchmetrics",
    "torchvision",
    "tqdm>=4.70.1",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"p1.inpainting" = ["configs/*.yaml"]

[tool.setuptools.packages.find]
include = ["p[0-9]*"]
exclude = ["p*.data*", "p*.scripts*"]

[tool.ruff]
line-length = 121
